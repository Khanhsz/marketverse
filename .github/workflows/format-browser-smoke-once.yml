name: Format New Browser Smoke (one-shot)
on:
  push:
    branches:
      - chore/remove-legacy-ui-and-map
    paths:
      - .github/workflows/format-browser-smoke-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-legacy-ui-and-map
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/browser-smoke.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format current-map browser regression"
            git push origin HEAD:chore/remove-legacy-ui-and-map
          fi
