name: One-shot Format Polygon POC
on:
  push:
    branches: [codex/marketverse-sprint-continuation]
    paths: ['.github/workflows/format-polygon-poc-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/marketverse-sprint-continuation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/poc/main.ts src/poc/geometry.ts src/poc/style.css tests/polygon-poc.test.mjs scripts/browser-polygon.mjs vite.config.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/poc/main.ts src/poc/geometry.ts src/poc/style.css tests/polygon-poc.test.mjs scripts/browser-polygon.mjs vite.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(poc): format polygon renderer and browser tests"
            git push origin HEAD:codex/marketverse-sprint-continuation
          fi
