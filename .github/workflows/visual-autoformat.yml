name: MarketVerse Visual UI Autoformat (one-shot)
on:
  push:
    branches:
      - codex/marketverse-sprint-continuation
    paths:
      - .github/workflows/visual-autoformat.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/marketverse-sprint-continuation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Format changed UX and browser test files
        run: npx prettier --write src/ui/App.tsx src/ui/CountryMap.tsx src/ui/VisualUX.tsx src/ui/WeeklyPlanner.tsx src/ui/styles.css scripts/browser-visual.mjs scripts/run-browser-smoke.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/App.tsx src/ui/CountryMap.tsx src/ui/VisualUX.tsx src/ui/WeeklyPlanner.tsx src/ui/styles.css scripts/browser-visual.mjs scripts/run-browser-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): format UX view toggle and visual smoke tests"
            git push origin HEAD:codex/marketverse-sprint-continuation
          fi
