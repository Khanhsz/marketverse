name: MarketVerse CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketverse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: node scripts/check-sprint-state.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:map:prod
      - run: npm run test:campaign:prod
      - run: npm run test:replay:cross
      - run: npm run test:balance
