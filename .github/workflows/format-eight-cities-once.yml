name: One-shot format eight cities
on:
  push:
    branches: [codex/marketverse-sprint-continuation]
    paths: ['.github/workflows/format-eight-cities-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/marketverse-sprint-continuation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/ui/App.tsx src/ui/VisualUX.tsx scripts/browser-visual.mjs scripts/browser-smoke.mjs scripts/browser-campaign.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/App.tsx src/ui/VisualUX.tsx scripts/browser-visual.mjs scripts/browser-smoke.mjs scripts/browser-campaign.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format eight-city default and save migration affordance"
            git push origin HEAD:codex/marketverse-sprint-continuation
          fi
