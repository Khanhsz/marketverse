name: Format Legacy Cleanup (one-shot)
on:
  push:
    branches:
      - chore/remove-legacy-ui-and-map
    paths:
      - .github/workflows/format-legacy-cleanup-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-legacy-ui-and-map
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/ui/App.tsx src/ui/CountryMap.tsx src/map/cityAnchors.ts src/map/atlasLayers.ts src/ui/camera.ts src/ui/VisualUX.tsx src/ui/styles.css scripts/browser-visual.mjs tests/city-anchors.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/App.tsx src/ui/CountryMap.tsx src/map/cityAnchors.ts src/map/atlasLayers.ts src/ui/camera.ts src/ui/VisualUX.tsx src/ui/styles.css scripts/browser-visual.mjs tests/city-anchors.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format single-map cleanup"
            git push origin HEAD:chore/remove-legacy-ui-and-map
          fi
