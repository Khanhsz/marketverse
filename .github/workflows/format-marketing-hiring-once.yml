name: Format Marketing Planner (one-shot)
on:
  push:
    branches:
      - feat/marketing-people-controls-no-team-cap
    paths:
      - .github/workflows/format-marketing-hiring-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketing-people-controls-no-team-cap
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/ui/WeeklyPlanner.tsx src/ui/plannerModel.ts src/ui/styles.css src/engine/orders.ts src/engine/people.ts scripts/browser-campaign.mjs tests/planner-controls.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/WeeklyPlanner.tsx src/ui/plannerModel.ts src/ui/styles.css src/engine/orders.ts src/engine/people.ts scripts/browser-campaign.mjs tests/planner-controls.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(planner): format media and staffing redesign"
            git push origin HEAD:feat/marketing-people-controls-no-team-cap
          fi
