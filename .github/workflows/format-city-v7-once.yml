name: One-shot Format City V7
on:
  push:
    branches: [codex/marketverse-sprint-continuation]
    paths: ['.github/workflows/format-city-v7-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/marketverse-sprint-continuation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/ui/CityMapV7.tsx src/ui/App.tsx src/ui/styles.css scripts/browser-visual.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/CityMapV7.tsx src/ui/App.tsx src/ui/styles.css scripts/browser-visual.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(city): format V7 city preview and smoke test"
            git push origin HEAD:codex/marketverse-sprint-continuation
          fi
